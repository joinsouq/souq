<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Souq Capital</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Pre-render shell styles: visible before JS loads, scoped so they don't
         conflict with the app once React mounts and removes .pre-shell -->
    <style>
      body { margin: 0; background: #fff; }
      .pre-shell * { box-sizing: border-box; }
      .pre-nav {
        position: fixed; top: 0; left: 0; right: 0; height: 64px;
        background: white; border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 50; display: flex; align-items: center; padding: 0 50px;
      }
      .pre-badge {
        background: #14181A; color: white; font-weight: 700; font-size: 14px;
        padding: 6px 12px; border-radius: 8px; font-family: Inter, sans-serif;
        letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 1px;
      }
      .pre-globe { display: inline-block; flex-shrink: 0; margin: 0 1px; vertical-align: middle; }
      .pre-hero {
        padding: 160px 50px 80px;
      }
      .pre-h1 {
        font-size: 80px; font-weight: 600; letter-spacing: -3px;
        line-height: 1.05; font-family: Inter, sans-serif; color: #14181A;
        max-width: 900px; margin: 0;
      }
      .pre-sub {
        margin-top: 24px; font-size: 15px; font-weight: 500;
        letter-spacing: -0.01em; color: #787777; font-family: Inter, sans-serif;
      }
      @media (max-width: 809px) {
        .pre-nav { padding: 0 24px; }
        .pre-hero { padding: 100px 24px 60px; }
        .pre-h1 { font-size: 44px; letter-spacing: -1.5px; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static shell rendered instantly before JS loads.
           React mounts into #root and replaces this on hydration. -->
      <div class="pre-shell">
        <nav class="pre-nav">
          <span class="pre-badge">S<svg class="pre-globe" width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true"><circle cx="6.5" cy="6.5" r="5.5" stroke="white" stroke-width="1"/><ellipse cx="6.5" cy="6.5" rx="2.8" ry="5.5" stroke="white" stroke-width="1"/><line x1="1" y1="6.5" x2="12" y2="6.5" stroke="white" stroke-width="1"/></svg>uq</span>
        </nav>
        <div class="pre-hero">
          <h1 class="pre-h1">Scaling the next generation of brands.</h1>
          <p class="pre-sub">from the Founders of Souq Capital and Veiled</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
