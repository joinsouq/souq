name: Deploy souq-jobs Worker

# The site (souqweb Pages) deploys itself from GitHub. The souq-jobs Worker
# doesn't, so every push to souq-v2 deploys it here. Secrets like
# ANTHROPIC_API_KEY live in Cloudflare, not here; this only needs a
# Cloudflare API token.

on:
  push:
    branches: [souq-v2]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 4890f78e2c1eb373783092cacc38d1d2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy the jobs Worker
        run: pnpm exec wrangler deploy -c jobs/wrangler.toml

